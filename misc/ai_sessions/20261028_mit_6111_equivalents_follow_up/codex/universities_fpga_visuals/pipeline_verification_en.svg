   <g id="text_6">
    <text style="fill: #1d3446; font: 700 13px 'DejaVu Sans', 'Droid Sans Fallback'; text-anchor: middle" x="504" y="189.2808" transform="rotate(-0 504 189.2808)">Data + valid →       ← ready / backpressure</text>
   </g>
   <g id="text_7">
    <text style="fill: #006b72; font: 12px 'DejaVu Sans', 'Droid Sans Fallback'; text-anchor: middle" x="504" y="345.7728" transform="rotate(-0 504 345.7728)">A transfer occurs only when valid AND ready. Stalled stages must retain their data.</text>
   </g>
